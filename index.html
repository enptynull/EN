<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>고정지출 & 저축 플래너 Pro</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap');
    body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
    .badge-expense { background-color: #fee2e2; color: #b91c1c; }
    .badge-savings { background-color: #dbeafe; color: #1d4ed8; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-16 antialiased">
  <!-- 토스트 알림 컨테이너 -->
  <div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 z-[100] transition-all duration-300 opacity-0 pointer-events-none translate-y-[-10px]">
    <div class="bg-slate-900/90 backdrop-blur text-white text-xs px-4 py-2.5 rounded-full shadow-lg flex items-center gap-2">
      <i data-lucide="check-circle" class="w-4 h-4 text-emerald-400"></i>
      <span id="toastMsg">작업이 완료되었습니다.</span>
    </div>
  </div>

  <div class="max-w-2xl mx-auto px-4 py-6">
    
    <!-- 상단 헤더 -->
    <header class="flex justify-between items-center mb-5">
      <div>
        <h1 class="text-xl font-bold text-slate-900 tracking-tight flex items-center gap-1.5">
          <i data-lucide="wallet-cards" class="w-6 h-6 text-indigo-600"></i>
          고정지출 플래너 Pro
        </h1>
        <p class="text-xs text-slate-500 mt-0.5" id="currentDateDisplay">오늘 기준 정산 플랜</p>
      </div>
      <div class="flex items-center gap-1.5">
        <button id="quickFillBtn" class="text-xs bg-slate-200 hover:bg-slate-300 text-slate-700 px-2.5 py-1.5 rounded-lg font-medium transition">
          샘플 데이터
        </button>
        <button id="exportBtn" title="데이터 백업" class="p-1.5 bg-white border border-slate-200 text-slate-600 hover:bg-slate-100 rounded-lg shadow-sm">
          <i data-lucide="download" class="w-4 h-4"></i>
        </button>
        <label for="importFile" title="데이터 복원" class="p-1.5 bg-white border border-slate-200 text-slate-600 hover:bg-slate-100 rounded-lg shadow-sm cursor-pointer">
          <i data-lucide="upload" class="w-4 h-4"></i>
        </label>
        <input type="file" id="importFile" class="hidden" accept=".json" />
      </div>
    </header>

    <!-- 대시보드 카드 영역 -->
    <section class="grid grid-cols-2 gap-3 mb-4">
      <!-- 1. 순수 지출 (월 / 연) -->
      <div class="bg-white p-3.5 rounded-xl border border-rose-100 shadow-sm">
        <div class="flex items-center justify-between">
          <span class="text-xs font-semibold text-rose-600">순수 고정지출</span>
          <span class="text-[10px] bg-rose-50 text-rose-500 px-1.5 py-0.5 rounded font-mono">Expense</span>
        </div>
        <div class="mt-2">
          <span class="text-lg font-bold text-slate-900" id="monthlyExpense">0원</span>
          <span class="text-[11px] text-slate-400 block mt-0.5" id="annualExpense">연 0원</span>
        </div>
      </div>

      <!-- 2. 저축 및 투자 (월 / 연) -->
      <div class="bg-white p-3.5 rounded-xl border border-blue-100 shadow-sm">
        <div class="flex items-center justify-between">
          <span class="text-xs font-semibold text-blue-600">저축 · 자산 형성</span>
          <span class="text-[10px] bg-blue-50 text-blue-500 px-1.5 py-0.5 rounded font-mono" id="savingsRate">0%</span>
        </div>
        <div class="mt-2">
          <span class="text-lg font-bold text-slate-900" id="monthlySavings">0원</span>
          <span class="text-[11px] text-slate-400 block mt-0.5" id="annualSavings">연 0원</span>
        </div>
      </div>

      <!-- 3. 전체 합계 (월 / 연) -->
      <div class="bg-white p-3.5 rounded-xl border border-slate-200 shadow-sm">
        <div class="text-xs font-semibold text-slate-600">월 총 고정자금</div>
        <div class="mt-2">
          <span class="text-lg font-bold text-indigo-700" id="totalMonthly">0원</span>
          <span class="text-[11px] text-slate-400 block mt-0.5" id="totalAnnual">연 0원</span>
        </div>
      </div>

      <!-- 4. 오늘 기준 남은 출금 예정액 -->
      <div class="bg-gradient-to-br from-indigo-50 to-slate-50 p-3.5 rounded-xl border border-indigo-100 shadow-sm">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold text-indigo-900">오늘 이후 남은 지출</span>
          <i data-lucide="calendar-clock" class="w-3.5 h-3.5 text-indigo-500"></i>
        </div>
        <div class="mt-2">
          <span class="text-lg font-bold text-rose-600" id="todayRemainingAmount">0원</span>
          <span class="text-[11px] text-slate-500 block mt-0.5" id="todayRemainingCount">남은 납부 0건</span>
        </div>
      </div>
    </section>

    <!-- 차트 토글 뷰 -->
    <details class="bg-white rounded-xl border border-slate-200 p-3.5 mb-4 shadow-sm group">
      <summary class="flex justify-between items-center cursor-pointer list-none text-xs font-semibold text-slate-700">
        <span class="flex items-center gap-1.5">
          <i data-lucide="pie-chart" class="w-4 h-4 text-indigo-500"></i>
          지출 포트폴리오 및 카테고리 분석
        </span>
        <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400 transition-transform group-open:rotate-180"></i>
      </summary>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-4 pt-3 border-t border-slate-100 items-center">
        <div>
          <p class="text-[11px] text-center text-slate-500 mb-1 font-medium">지출 vs 저축 비율</p>
          <div class="w-36 h-36 mx-auto"><canvas id="typeChart"></canvas></div>
        </div>
        <div>
          <p class="text-[11px] text-center text-slate-500 mb-1 font-medium">카테고리별 비중</p>
          <div class="w-36 h-36 mx-auto"><canvas id="catChart"></canvas></div>
        </div>
      </div>
    </details>

    <!-- 리스트 필터 / 탭 / 등록 버튼 -->
    <div class="flex flex-col gap-2.5 mb-3">
      <div class="flex items-center justify-between gap-2">
        <!-- 필터 탭 -->
        <div class="inline-flex bg-slate-200/80 p-0.5 rounded-lg text-xs font-medium overflow-x-auto max-w-full">
          <button data-filter="all" class="filter-tab px-2.5 py-1 rounded-md bg-white text-slate-900 shadow-sm transition shrink-0">전체</button>
          <button data-filter="expense" class="filter-tab px-2.5 py-1 rounded-md text-slate-600 hover:text-slate-900 transition shrink-0">순수지출</button>
          <button data-filter="savings" class="filter-tab px-2.5 py-1 rounded-md text-slate-600 hover:text-slate-900 transition shrink-0">저축·적금</button>
          <button data-filter="duration" class="filter-tab px-2.5 py-1 rounded-md text-slate-600 hover:text-slate-900 transition shrink-0">기한/만기형</button>
          <button data-filter="unpaid" class="filter-tab px-2.5 py-1 rounded-md text-slate-600 hover:text-slate-900 transition shrink-0">미납만</button>
        </div>

        <!-- 추가 버튼 -->
        <button id="openAddModalBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold px-3 py-1.5 rounded-lg flex items-center gap-1 shadow-sm transition shrink-0">
          <i data-lucide="plus" class="w-3.5 h-3.5"></i> 추가
        </button>
      </div>

      <!-- 검색 및 정렬 -->
      <div class="flex gap-2">
        <div class="relative flex-1">
          <i data-lucide="search" class="w-3.5 h-3.5 absolute left-2.5 top-2.5 text-slate-400"></i>
          <input type="text" id="searchInput" placeholder="항목명, 계좌, 카드, 메모 검색" class="w-full pl-8 pr-3 py-1.5 bg-white border border-slate-200 rounded-lg text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
        </div>
        <select id="sortSelect" class="bg-white border border-slate-200 rounded-lg px-2.5 py-1.5 text-xs text-slate-700 focus:outline-none">
          <option value="day">결제일순</option>
          <option value="amountDesc">금액 높은순</option>
          <option value="amountAsc">금액 낮은순</option>
          <option value="name">이름순</option>
        </select>
      </div>
    </div>

    <!-- 고정지출 리스트 -->
    <div id="expenseList" class="space-y-2">
      <!-- 동적 렌더링 영역 -->
    </div>

    <!-- 빈 상태 안내 -->
    <div id="emptyState" class="hidden text-center py-12 bg-white rounded-xl border border-dashed border-slate-200 mt-2">
      <i data-lucide="inbox" class="w-10 h-10 mx-auto text-slate-300 mb-2"></i>
      <p class="text-xs text-slate-500">등록된 고정 지출 항목이 없습니다.</p>
    </div>
  </div>

  <!-- 추가/수정 모달 -->
  <div id="itemModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-sm w-full p-5 shadow-xl animate-in fade-in zoom-in-95 duration-150 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-4">
        <h3 id="modalTitle" class="text-base font-bold text-slate-900">고정 항목 추가</h3>
        <button id="closeModalBtn" type="button" class="text-slate-400 hover:text-slate-600 p-1">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="itemForm" class="space-y-3.5 text-xs">
        <input type="hidden" id="itemId" />
        <input type="hidden" id="itemType" value="expense" />

        <!-- 1. 지출 분류 (모바일 터치 최적화 버튼형 세그먼트) -->
        <div>
          <label class="block font-semibold text-slate-700 mb-1.5">성격 구분 *</label>
          <div class="grid grid-cols-2 gap-2">
            <button type="button" id="btnTypeExpense" class="flex items-center justify-center gap-1.5 py-2.5 rounded-xl border font-semibold transition bg-rose-50 border-rose-500 text-rose-700 shadow-sm">
              <i data-lucide="receipt" class="w-3.5 h-3.5"></i> 순수 지출
            </button>
            <button type="button" id="btnTypeSavings" class="flex items-center justify-center gap-1.5 py-2.5 rounded-xl border font-semibold transition bg-white border-slate-200 text-slate-600 hover:bg-slate-50">
              <i data-lucide="piggy-bank" class="w-3.5 h-3.5"></i> 저축 · 적금
            </button>
          </div>
        </div>

        <!-- 2. 항목명 -->
        <div>
          <label class="block font-semibold text-slate-700 mb-1">항목명 *</label>
          <input type="text" id="itemName" required placeholder="예: 주담대1, 청약통장, 넷플릭스" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
        </div>

        <!-- 금액 & 결제일 -->
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-semibold text-slate-700 mb-1">월 금액 (원) *</label>
            <input type="number" id="itemAmount" required min="1" step="1" inputmode="numeric" placeholder="893787" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
          </div>
          <div>
            <label class="block font-semibold text-slate-700 mb-1">결제일 (매월) *</label>
            <div class="flex items-center">
              <input type="number" id="itemDay" required min="1" max="31" inputmode="numeric" placeholder="25" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
              <span class="ml-1.5 text-slate-500">일</span>
            </div>
          </div>
        </div>

        <!-- 실시간 한글 금액 표기 & 원터치 추가 버튼 -->
        <div class="bg-slate-50 p-2.5 rounded-lg border border-slate-100">
          <div class="flex items-center justify-between text-[11px] mb-1.5">
            <span class="text-slate-500">금액 미리보기:</span>
            <span id="amountKoreanPreview" class="font-bold text-indigo-600">0원</span>
          </div>
          <div class="flex flex-wrap gap-1">
            <button type="button" class="quick-amt-btn px-2 py-0.5 bg-white border border-slate-200 rounded text-[10px] text-slate-600 hover:border-indigo-400" data-amt="10000">+1만</button>
            <button type="button" class="quick-amt-btn px-2 py-0.5 bg-white border border-slate-200 rounded text-[10px] text-slate-600 hover:border-indigo-400" data-amt="50000">+5만</button>
            <button type="button" class="quick-amt-btn px-2 py-0.5 bg-white border border-slate-200 rounded text-[10px] text-slate-600 hover:border-indigo-400" data-amt="100000">+10만</button>
            <button type="button" class="quick-amt-btn px-2 py-0.5 bg-white border border-slate-200 rounded text-[10px] text-slate-600 hover:border-indigo-400" data-amt="500000">+50만</button>
            <button type="button" class="quick-amt-btn px-2 py-0.5 bg-white border border-slate-200 rounded text-[10px] text-slate-600 hover:border-indigo-400" data-amt="1000000">+100만</button>
            <button type="button" id="btnResetAmt" class="px-2 py-0.5 bg-slate-200 rounded text-[10px] text-slate-600 hover:bg-slate-300">정정</button>
          </div>
        </div>

        <!-- 3. 카테고리 -->
        <div>
          <label class="block font-semibold text-slate-700 mb-1">카테고리 *</label>
          <select id="itemCategory" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white">
            <option value="주거/통신">주거 / 통신 / 관리비</option>
            <option value="금융/보험">금융 / 대출이자 / 보험</option>
            <option value="저축/투자">적금 / 청약 / 연금 / ETF</option>
            <option value="구독/회비">구독 / 스트리밍 / 멤버십</option>
            <option value="생활/렌탈">생활비 / 렌탈 / 정기배송</option>
            <option value="기타">기타 고정지출</option>
          </select>
        </div>

        <!-- 4. 결제 수단 (계좌이체 / 카드 등) -->
        <div>
          <label class="block font-semibold text-slate-700 mb-1">결제 수단 *</label>
          <select id="itemPaymentMethod" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white">
            <option value="account">🏦 지출계좌 (자동이체)</option>
            <option value="credit">💳 신용카드</option>
            <option value="check">💳 체크카드</option>
            <option value="direct">💸 직접송금 / 지로</option>
          </select>
        </div>

        <div>
          <label class="block font-semibold text-slate-700 mb-1">결제 계좌 / 카드 상세</label>
          <input type="text" id="itemPaymentDetail" placeholder="예: 우리꿈통장, 국민은행 급여계좌" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
        </div>

        <!-- 5. 메모 -->
        <div>
          <label class="block font-semibold text-slate-700 mb-1">메모 (선택)</label>
          <input type="text" id="itemMemo" placeholder="예: 2년 약정 할인, 청년도약계좌 혜택" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
        </div>

        <!-- 6. 지출 기한 더보기 옵션 (안정적 UI 구성) -->
        <details id="moreOptionsDetails" class="group border border-slate-200/90 rounded-xl p-3 bg-slate-50/70 transition-colors">
          <summary class="flex justify-between items-center cursor-pointer list-none text-xs font-semibold text-slate-700 hover:text-slate-900 select-none">
            <span class="flex items-center gap-1.5">
              <i data-lucide="calendar" class="w-3.5 h-3.5 text-indigo-500"></i>
              더보기 (지출 기한 / 적금 만기 설정)
            </span>
            <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-slate-400 transition-transform group-open:rotate-180"></i>
          </summary>
          <div class="mt-3 pt-2.5 border-t border-slate-200 space-y-2.5">
            <div>
              <label class="block font-semibold text-slate-700 mb-1 text-[11px]">기한 설정 방식</label>
              <div class="grid grid-cols-2 gap-1.5">
                <button type="button" id="btnDurationIndefinite" class="py-1.5 rounded-lg border text-xs font-medium bg-indigo-50 border-indigo-500 text-indigo-700 transition">
                  무기한 (계속)
                </button>
                <button type="button" id="btnDurationFixed" class="py-1.5 rounded-lg border text-xs font-medium bg-white border-slate-200 text-slate-600 transition">
                  기한 지정 (월)
                </button>
              </div>
            </div>

            <!-- 기한 입력 영역 (기한 지정 활성화 시 노출) -->
            <div id="durationInputArea" class="hidden space-y-2 pt-1">
              <div>
                <label class="block font-medium text-slate-700 mb-1 text-[11px]">총 기간 (개월 수) *</label>
                <div class="flex items-center gap-1.5">
                  <input type="number" id="itemDurationMonths" min="1" step="1" inputmode="numeric" placeholder="12" class="w-full px-2.5 py-1.5 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-xs bg-white" />
                  <span class="text-slate-500 text-xs shrink-0 font-medium">개월</span>
                </div>
              </div>

              <!-- 빠른 개월 수 선택 칩 -->
              <div class="flex gap-1">
                <button type="button" class="quick-month-btn flex-1 py-1 bg-white border border-slate-200 rounded text-[10px] text-slate-600 hover:border-indigo-400 font-medium" data-month="6">6개월</button>
                <button type="button" class="quick-month-btn flex-1 py-1 bg-white border border-slate-200 rounded text-[10px] text-slate-600 hover:border-indigo-400 font-medium" data-month="12">12개월</button>
                <button type="button" class="quick-month-btn flex-1 py-1 bg-white border border-slate-200 rounded text-[10px] text-slate-600 hover:border-indigo-400 font-medium" data-month="24">24개월</button>
                <button type="button" class="quick-month-btn flex-1 py-1 bg-white border border-slate-200 rounded text-[10px] text-slate-600 hover:border-indigo-400 font-medium" data-month="36">36개월</button>
              </div>

              <!-- 시작년월 (선택) -->
              <div>
                <label class="block font-medium text-slate-700 mb-1 text-[11px]">시작년월 (선택, 진행 회차 추적용)</label>
                <input type="month" id="itemStartYearMonth" class="w-full px-2.5 py-1.5 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-xs bg-white" />
              </div>

              <!-- 만기 총액 실시간 요약 미리보기 카드 -->
              <div id="maturitySummaryBox" class="bg-indigo-50/80 border border-indigo-100 rounded-lg p-2.5 text-[11px] text-indigo-900 space-y-0.5">
                <div class="flex justify-between font-semibold">
                  <span>만기 총 예상액:</span>
                  <span id="maturityTotalAmountText">0원</span>
                </div>
                <div id="maturityInfoText" class="text-[10px] text-indigo-600">
                  ※ 기간과 금액을 입력하면 총액이 계산됩니다.
                </div>
              </div>
            </div>
          </div>
        </details>

        <!-- 버튼 영역 -->
        <div class="flex gap-2 pt-2">
          <button type="button" id="cancelModalBtn" class="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-medium transition">취소</button>
          <button type="submit" id="submitItemBtn" class="flex-1 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-semibold shadow-sm transition">저장하기</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // --- 1. 상태 및 로컬 스토리지 초기화 ---
    const STORAGE_KEY = 'fixed_expenses_v3';
    let expenses = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    let currentFilter = 'all';
    let typeChartInstance = null;
    let catChartInstance = null;
    let currentDurationMode = 'indefinite'; // 'indefinite' | 'fixed'

    // 이전 데이터 호환성 보정
    expenses = expenses.map(item => ({
      id: item.id || Date.now() + Math.random().toString(36).substr(2, 9),
      name: item.name || '미지정',
      amount: Number(item.amount) || 0,
      day: Number(item.day) || 1,
      category: item.category || '기타',
      type: item.type || (item.category === '저축/투자' ? 'savings' : 'expense'),
      paymentMethod: item.paymentMethod || 'account',
      paymentDetail: item.paymentDetail || '',
      memo: item.memo || '',
      durationMonths: (item.durationMonths && Number(item.durationMonths) > 0) ? Number(item.durationMonths) : null,
      startYearMonth: item.startYearMonth || null,
      isPaid: Boolean(item.isPaid)
    }));

    // --- 2. 기본 샘플 데이터셋 ---
    const sampleData = [
      { id: '1', name: '청약 및 비상금 적금', amount: 300000, day: 10, category: '저축/투자', type: 'savings', paymentMethod: 'account', paymentDetail: '국민은행 주거래계좌', memo: '비과세 저축', durationMonths: 24, startYearMonth: '2024-01', isPaid: true },
      { id: '2', name: '주담대 원리금 상환', amount: 893787, day: 29, category: '금융/보험', type: 'expense', paymentMethod: 'account', paymentDetail: '우리꿈통장 자동이체', memo: '고정금리 3.8%', durationMonths: 360, startYearMonth: '2023-05', isPaid: false },
      { id: '3', name: '스마트폰 5G 요금', amount: 55000, day: 21, category: '주거/통신', type: 'expense', paymentMethod: 'credit', paymentDetail: '현대카드 Zero', memo: '선택약정 25% 할인', durationMonths: 12, startYearMonth: '2024-03', isPaid: false },
      { id: '4', name: '실손 의료비 보험', amount: 48000, day: 15, category: '금융/보험', type: 'expense', paymentMethod: 'account', paymentDetail: '국민은행 자동이체', memo: '4세대 실손', durationMonths: null, startYearMonth: null, isPaid: true },
      { id: '5', name: '연금저축펀드(ETF)', amount: 200000, day: 28, category: '저축/투자', type: 'savings', paymentMethod: 'account', paymentDetail: '미래에셋증권 CMA', memo: '세액공제 연 600만', durationMonths: null, startYearMonth: null, isPaid: false },
      { id: '6', name: '넷플릭스 프리미엄', amount: 17000, day: 5, category: '구독/회비', type: 'expense', paymentMethod: 'check', paymentDetail: '토스뱅크 체크카드', memo: '가족 공유', durationMonths: null, startYearMonth: null, isPaid: true }
    ];

    function saveExpenses() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(expenses));
      render();
    }

    // 토스트 알림 함수
    function showToast(message) {
      const toast = document.getElementById('toast');
      document.getElementById('toastMsg').textContent = message;
      toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-[-10px]');
      toast.classList.add('opacity-100', 'translate-y-0');
      setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-[-10px]');
        toast.classList.remove('opacity-100', 'translate-y-0');
      }, 2300);
    }

    // 한글 금액 변환 유틸리티 (자릿수 오류 방지)
    function formatKoreanAmount(num) {
      if (!num || num <= 0) return '0원';
      const n = Math.floor(num);
      const eok = Math.floor(n / 100000000);
      const man = Math.floor((n % 100000000) / 10000);
      const rest = n % 10000;
      let result = '';
      if (eok > 0) result += `${eok}억 `;
      if (man > 0) result += `${man}만 `;
      if (rest > 0 || result === '') result += `${rest.toLocaleString()}원`;
      else result += '원';
      return result.trim();
    }

    // 오늘 날짜 표기
    const today = new Date();
    const currentYear = today.getFullYear();
    const currentMonth = today.getMonth() + 1;
    const currentDay = today.getDate();
    document.getElementById('currentDateDisplay').textContent = 
      `${currentYear}년 ${currentMonth}월 ${currentDay}일 기준`;

    function getDDayBadge(day, isPaid) {
      if (isPaid) {
        return '<span class="text-[10px] bg-slate-100 text-slate-500 font-medium px-2 py-0.5 rounded-full">완납</span>';
      }
      const diff = day - currentDay;
      if (diff === 0) {
        return '<span class="text-[10px] bg-rose-500 text-white font-bold px-2 py-0.5 rounded-full animate-pulse">오늘 D-Day</span>';
      } else if (diff > 0) {
        return `<span class="text-[10px] bg-amber-100 text-amber-800 font-semibold px-2 py-0.5 rounded-full">D-${diff}</span>`;
      } else {
        return `<span class="text-[10px] bg-slate-200 text-slate-600 font-medium px-2 py-0.5 rounded-full">${Math.abs(diff)}일 지남</span>`;
      }
    }

    function getPaymentBadge(method, detail) {
      const icons = {
        account: '🏦 계좌이체',
        credit: '💳 신용카드',
        check: '💳 체크카드',
        direct: '💸 직접송금'
      };
      const label = icons[method] || '기타';
      const detailText = detail ? ` · ${detail}` : '';
      return `<span class="text-[10px] bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded border border-slate-200 font-normal">${label}${detailText}</span>`;
    }

    // 기한 및 회차 계산 유틸리티
    function getDurationBadge(durationMonths, startYearMonth) {
      if (!durationMonths) return '';
      let progressText = `${durationMonths}개월`;

      if (startYearMonth) {
        const [sYear, sMonth] = startYearMonth.split('-').map(Number);
        const elapsedMonths = (currentYear - sYear) * 12 + (currentMonth - sMonth);
        const currentRound = Math.max(1, Math.min(durationMonths, elapsedMonths + 1));
        const remaining = Math.max(0, durationMonths - currentRound);

        if (currentRound >= durationMonths) {
          return `<span class="text-[10px] bg-emerald-50 text-emerald-700 px-1.5 py-0.5 rounded border border-emerald-200 font-medium">만기 완료 (${durationMonths}회)</span>`;
        }
        return `<span class="text-[10px] bg-indigo-50 text-indigo-700 px-1.5 py-0.5 rounded border border-indigo-200 font-medium">${currentRound}/${durationMonths}회 (잔여 ${remaining}개월)</span>`;
      }

      return `<span class="text-[10px] bg-indigo-50 text-indigo-700 px-1.5 py-0.5 rounded border border-indigo-200 font-medium">${progressText} 약정</span>`;
    }

    // --- 3. 렌더링 및 통계 계산 ---
    function render() {
      let expMonthly = 0;
      let savMonthly = 0;
      let todayRemaining = 0;
      let todayRemainingCount = 0;

      expenses.forEach(item => {
        if (item.type === 'savings') {
          savMonthly += item.amount;
        } else {
          expMonthly += item.amount;
        }

        if (!item.isPaid && item.day >= currentDay) {
          todayRemaining += item.amount;
          todayRemainingCount++;
        }
      });

      const totalMonthly = expMonthly + savMonthly;
      const savRate = totalMonthly > 0 ? ((savMonthly / totalMonthly) * 100).toFixed(0) : 0;

      document.getElementById('monthlyExpense').textContent = `${expMonthly.toLocaleString()}원`;
      document.getElementById('annualExpense').textContent = `연 ${(expMonthly * 12).toLocaleString()}원`;

      document.getElementById('monthlySavings').textContent = `${savMonthly.toLocaleString()}원`;
      document.getElementById('annualSavings').textContent = `연 ${(savMonthly * 12).toLocaleString()}원`;
      document.getElementById('savingsRate').textContent = `저축비중 ${savRate}%`;

      document.getElementById('totalMonthly').textContent = `${totalMonthly.toLocaleString()}원`;
      document.getElementById('totalAnnual').textContent = `연 ${(totalMonthly * 12).toLocaleString()}원`;

      document.getElementById('todayRemainingAmount').textContent = `${todayRemaining.toLocaleString()}원`;
      document.getElementById('todayRemainingCount').textContent = `출금 예정 ${todayRemainingCount}건`;

      // 필터링 및 검색
      const searchKeyword = document.getElementById('searchInput').value.trim().toLowerCase();
      const sortVal = document.getElementById('sortSelect').value;

      let filtered = expenses.filter(item => {
        if (currentFilter === 'expense' && item.type !== 'expense') return false;
        if (currentFilter === 'savings' && item.type !== 'savings') return false;
        if (currentFilter === 'duration' && (!item.durationMonths || item.durationMonths <= 0)) return false;
        if (currentFilter === 'unpaid' && item.isPaid) return false;
        
        if (searchKeyword) {
          const matchTarget = `${item.name} ${item.category} ${item.paymentDetail} ${item.memo} ${item.durationMonths ? item.durationMonths + '개월' : ''}`.toLowerCase();
          return matchTarget.includes(searchKeyword);
        }
        return true;
      });

      // 정렬
      filtered.sort((a, b) => {
        if (sortVal === 'day') return a.day - b.day;
        if (sortVal === 'amountDesc') return b.amount - a.amount;
        if (sortVal === 'amountAsc') return a.amount - b.amount;
        if (sortVal === 'name') return a.name.localeCompare(b.name);
        return 0;
      });

      // DOM 출력
      const listEl = document.getElementById('expenseList');
      const emptyEl = document.getElementById('emptyState');
      listEl.innerHTML = '';

      if (filtered.length === 0) {
        emptyEl.classList.remove('hidden');
      } else {
        emptyEl.classList.add('hidden');
        filtered.forEach(item => {
          const card = document.createElement('div');
          card.className = `p-3.5 rounded-xl border transition shadow-sm bg-white flex items-center justify-between gap-3 ${item.isPaid ? 'opacity-60 bg-slate-50' : 'hover:border-slate-300'}`;
          
          const isSavings = item.type === 'savings';
          const typeBadge = isSavings
            ? '<span class="text-[10px] px-1.5 py-0.5 rounded font-semibold badge-savings">저축</span>'
            : '<span class="text-[10px] px-1.5 py-0.5 rounded font-semibold badge-expense">지출</span>';

          const durationBadgeHtml = getDurationBadge(item.durationMonths, item.startYearMonth);
          const totalAccumulatedText = item.durationMonths 
            ? `만기 ${(item.amount * item.durationMonths).toLocaleString()}원` 
            : `연 ${(item.amount * 12).toLocaleString()}원`;

          card.innerHTML = `
            <div class="flex items-center gap-3 min-w-0">
              <input type="checkbox" data-id="${item.id}" class="toggle-paid w-4 h-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 cursor-pointer shrink-0" ${item.isPaid ? 'checked' : ''}>
              <div class="min-w-0">
                <div class="flex items-center gap-1.5 flex-wrap">
                  ${typeBadge}
                  <span class="font-bold text-xs text-slate-800 truncate ${item.isPaid ? 'line-through text-slate-400' : ''}">${item.name}</span>
                  ${getDDayBadge(item.day, item.isPaid)}
                </div>
                <div class="flex items-center gap-1.5 mt-1 flex-wrap text-slate-500">
                  <span class="text-[11px] font-medium text-slate-600">매월 ${item.day}일</span>
                  <span class="text-[10px] text-slate-300">•</span>
                  ${getPaymentBadge(item.paymentMethod, item.paymentDetail)}
                  ${durationBadgeHtml}
                  ${item.memo ? `<span class="text-[10px] text-slate-400 truncate max-w-[130px]">(${item.memo})</span>` : ''}
                </div>
              </div>
            </div>

            <div class="text-right flex-shrink-0">
              <div class="font-bold text-sm ${item.isPaid ? 'text-slate-400' : (isSavings ? 'text-blue-700' : 'text-slate-900')}">
                ${item.amount.toLocaleString()}원
              </div>
              <div class="text-[10px] text-slate-400 mt-0.5 font-medium">
                ${totalAccumulatedText}
              </div>
              <div class="flex items-center justify-end gap-1 mt-1">
                <button data-id="${item.id}" class="edit-btn text-slate-400 hover:text-indigo-600 p-1" title="수정"><i data-lucide="edit-3" class="w-3.5 h-3.5"></i></button>
                <button data-id="${item.id}" class="delete-btn text-slate-400 hover:text-rose-600 p-1" title="삭제"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
              </div>
            </div>
          `;
          listEl.appendChild(card);
        });
      }

      renderCharts(expMonthly, savMonthly);
      lucide.createIcons();
    }

    // --- 4. Chart.js 시각화 ---
    function renderCharts(expTotal, savTotal) {
      const ctxType = document.getElementById('typeChart').getContext('2d');
      if (typeChartInstance) typeChartInstance.destroy();
      
      typeChartInstance = new Chart(ctxType, {
        type: 'doughnut',
        data: {
          labels: ['순수지출', '저축·적금'],
          datasets: [{
            data: [expTotal || 1, savTotal || 0],
            backgroundColor: ['#f87171', '#60a5fa'],
            borderWidth: 0
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          cutout: '70%'
        }
      });

      const catTotals = {};
      expenses.forEach(i => {
        catTotals[i.category] = (catTotals[i.category] || 0) + i.amount;
      });

      const ctxCat = document.getElementById('catChart').getContext('2d');
      if (catChartInstance) catChartInstance.destroy();

      catChartInstance = new Chart(ctxCat, {
        type: 'doughnut',
        data: {
          labels: Object.keys(catTotals),
          datasets: [{
            data: Object.values(catTotals),
            backgroundColor: ['#818cf8', '#34d399', '#f472b6', '#fbbf24', '#a78bfa', '#94a3b8'],
            borderWidth: 0
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          cutout: '70%'
        }
      });
    }

    // --- 5. 모달 및 폼 상태 관리 ---
    const modal = document.getElementById('itemModal');
    const form = document.getElementById('itemForm');
    const btnTypeExpense = document.getElementById('btnTypeExpense');
    const btnTypeSavings = document.getElementById('btnTypeSavings');
    const itemTypeInput = document.getElementById('itemType');
    const itemAmountInput = document.getElementById('itemAmount');
    const amountKoreanPreview = document.getElementById('amountKoreanPreview');
    const moreDetails = document.getElementById('moreOptionsDetails');
    const btnDurationIndefinite = document.getElementById('btnDurationIndefinite');
    const btnDurationFixed = document.getElementById('btnDurationFixed');
    const durationInputArea = document.getElementById('durationInputArea');
    const itemDurationMonths = document.getElementById('itemDurationMonths');
    const itemStartYearMonth = document.getElementById('itemStartYearMonth');
    const maturityTotalAmountText = document.getElementById('maturityTotalAmountText');
    const maturityInfoText = document.getElementById('maturityInfoText');

    // 지출 vs 저축 세그먼트 전환
    function setItemType(type) {
      itemTypeInput.value = type;
      if (type === 'savings') {
        btnTypeSavings.className = "flex items-center justify-center gap-1.5 py-2.5 rounded-xl border font-semibold transition bg-blue-50 border-blue-500 text-blue-700 shadow-sm";
        btnTypeExpense.className = "flex items-center justify-center gap-1.5 py-2.5 rounded-xl border font-semibold transition bg-white border-slate-200 text-slate-600 hover:bg-slate-50";
        // 카테고리 자동 권장
        const catSelect = document.getElementById('itemCategory');
        if (catSelect.value !== '저축/투자') {
          catSelect.value = '저축/투자';
        }
      } else {
        btnTypeExpense.className = "flex items-center justify-center gap-1.5 py-2.5 rounded-xl border font-semibold transition bg-rose-50 border-rose-500 text-rose-700 shadow-sm";
        btnTypeSavings.className = "flex items-center justify-center gap-1.5 py-2.5 rounded-xl border font-semibold transition bg-white border-slate-200 text-slate-600 hover:bg-slate-50";
        const catSelect = document.getElementById('itemCategory');
        if (catSelect.value === '저축/투자') {
          catSelect.value = '주거/통신';
        }
      }
      updateMaturityPreview();
    }

    btnTypeExpense.addEventListener('click', () => setItemType('expense'));
    btnTypeSavings.addEventListener('click', () => setItemType('savings'));

    // 카테고리 수동 변경 시 성격 자동 연동
    document.getElementById('itemCategory').addEventListener('change', (e) => {
      if (e.target.value === '저축/투자') {
        setItemType('savings');
      }
    });

    // 금액 실시간 한글 표기 & 계산
    function updateAmountPreview() {
      const amt = Number(itemAmountInput.value) || 0;
      amountKoreanPreview.textContent = formatKoreanAmount(amt);
      updateMaturityPreview();
    }

    itemAmountInput.addEventListener('input', updateAmountPreview);

    // 원터치 빠른 금액 추가 버튼
    document.querySelectorAll('.quick-amt-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const addVal = Number(btn.dataset.amt);
        const curVal = Number(itemAmountInput.value) || 0;
        itemAmountInput.value = curVal + addVal;
        updateAmountPreview();
      });
    });

    document.getElementById('btnResetAmt').addEventListener('click', () => {
      itemAmountInput.value = '';
      updateAmountPreview();
    });

    // 기한 설정 모드 전환 (무기한 vs 기한 지정)
    function setDurationMode(mode) {
      currentDurationMode = mode;
      if (mode === 'fixed') {
        btnDurationFixed.className = "py-1.5 rounded-lg border text-xs font-semibold bg-indigo-50 border-indigo-500 text-indigo-700 transition";
        btnDurationIndefinite.className = "py-1.5 rounded-lg border text-xs font-medium bg-white border-slate-200 text-slate-600 transition";
        durationInputArea.classList.remove('hidden');
        if (!itemDurationMonths.value) itemDurationMonths.value = '12';
      } else {
        btnDurationIndefinite.className = "py-1.5 rounded-lg border text-xs font-semibold bg-indigo-50 border-indigo-500 text-indigo-700 transition";
        btnDurationFixed.className = "py-1.5 rounded-lg border text-xs font-medium bg-white border-slate-200 text-slate-600 transition";
        durationInputArea.classList.add('hidden');
        itemDurationMonths.value = '';
        itemStartYearMonth.value = '';
      }
      updateMaturityPreview();
    }

    btnDurationIndefinite.addEventListener('click', () => setDurationMode('indefinite'));
    btnDurationFixed.addEventListener('click', () => setDurationMode('fixed'));

    // 퀵 개월 수 버튼
    document.querySelectorAll('.quick-month-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        itemDurationMonths.value = btn.dataset.month;
        updateMaturityPreview();
      });
    });

    itemDurationMonths.addEventListener('input', updateMaturityPreview);
    itemStartYearMonth.addEventListener('input', updateMaturityPreview);

    // 만기 총액 및 정보 실시간 계산
    function updateMaturityPreview() {
      const amt = Number(itemAmountInput.value) || 0;
      const months = parseInt(itemDurationMonths.value, 10);

      if (currentDurationMode === 'fixed' && months > 0 && amt > 0) {
        const total = amt * months;
        maturityTotalAmountText.textContent = `${total.toLocaleString()}원 (${formatKoreanAmount(total)})`;
        
        const typeLabel = itemTypeInput.value === 'savings' ? '적금 만기 시 총 저축액' : '약정 기간 동안 총 납부액';
        let detailMsg = `※ ${months}개월 동안 매월 ${amt.toLocaleString()}원씩 납부 시 ${typeLabel}입니다.`;

        if (itemStartYearMonth.value) {
          const [sY, sM] = itemStartYearMonth.value.split('-').map(Number);
          const endY = sY + Math.floor((sM - 1 + months) / 12);
          const endM = ((sM - 1 + months) % 12) + 1;
          detailMsg += ` (만기 예정월: ${endY}년 ${endM}월)`;
        }

        maturityInfoText.textContent = detailMsg;
      } else {
        maturityTotalAmountText.textContent = '0원';
        maturityInfoText.textContent = '※ 기간과 금액을 입력하면 만기 총액이 자동 계산됩니다.';
      }
    }

    // 모달 열기 & 닫기
    function openModal(editId = null) {
      form.reset();
      moreDetails.removeAttribute('open');
      setDurationMode('indefinite');
      setItemType('expense');
      amountKoreanPreview.textContent = '0원';

      if (editId) {
        const item = expenses.find(i => i.id === editId);
        if (!item) return;

        document.getElementById('modalTitle').textContent = '항목 수정';
        document.getElementById('itemId').value = item.id;
        setItemType(item.type || 'expense');
        document.getElementById('itemName').value = item.name;
        document.getElementById('itemAmount').value = item.amount;
        document.getElementById('itemDay').value = item.day;
        document.getElementById('itemCategory').value = item.category;
        document.getElementById('itemPaymentMethod').value = item.paymentMethod;
        document.getElementById('itemPaymentDetail').value = item.paymentDetail || '';
        document.getElementById('itemMemo').value = item.memo || '';

        updateAmountPreview();

        if (item.durationMonths && Number(item.durationMonths) > 0) {
          moreDetails.setAttribute('open', '');
          setDurationMode('fixed');
          itemDurationMonths.value = item.durationMonths;
          if (item.startYearMonth) {
            itemStartYearMonth.value = item.startYearMonth;
          }
          updateMaturityPreview();
        }
      } else {
        document.getElementById('modalTitle').textContent = '새 고정 항목 등록';
        document.getElementById('itemId').value = '';
        // 신규 등록 시 기본 오늘 날짜
        document.getElementById('itemDay').value = currentDay;
      }
      modal.classList.remove('hidden');
      lucide.createIcons();
    }

    function closeModal() {
      modal.classList.add('hidden');
    }

    document.getElementById('openAddModalBtn').addEventListener('click', () => openModal());
    document.getElementById('closeModalBtn').addEventListener('click', closeModal);
    document.getElementById('cancelModalBtn').addEventListener('click', closeModal);

    // 폼 저장 (디버그 및 예외 처리 완비)
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      try {
        const id = document.getElementById('itemId').value;
        const type = itemTypeInput.value || 'expense';
        const name = document.getElementById('itemName').value.trim();
        const amount = Number(document.getElementById('itemAmount').value);
        const day = Number(document.getElementById('itemDay').value);
        const category = document.getElementById('itemCategory').value;
        const paymentMethod = document.getElementById('itemPaymentMethod').value;
        const paymentDetail = document.getElementById('itemPaymentDetail').value.trim();
        const memo = document.getElementById('itemMemo').value.trim();

        if (!name) {
          alert('항목명을 입력해 주세요.');
          return;
        }
        if (!amount || amount <= 0) {
          alert('올바른 금액을 입력해 주세요.');
          return;
        }
        if (!day || day < 1 || day > 31) {
          alert('결제일은 1일부터 31일 사이로 입력해 주세요.');
          return;
        }

        // 기한 계산 (fixed 모드일 때만 개월 수 저장)
        let durationMonths = null;
        let startYearMonth = null;

        if (currentDurationMode === 'fixed') {
          const m = parseInt(itemDurationMonths.value, 10);
          if (!m || m < 1) {
            alert('기한 지정 시 개월 수를 1개월 이상 입력해 주세요.');
            itemDurationMonths.focus();
            return;
          }
          durationMonths = m;
          startYearMonth = itemStartYearMonth.value || null;
        }

        if (id) {
          // 수정
          const index = expenses.findIndex(i => i.id === id);
          if (index !== -1) {
            expenses[index] = {
              ...expenses[index],
              type,
              name,
              amount,
              day,
              category,
              paymentMethod,
              paymentDetail,
              memo,
              durationMonths,
              startYearMonth
            };
            showToast('항목이 성공적으로 수정되었습니다.');
          }
        } else {
          // 신규 추가
          expenses.push({
            id: Date.now().toString() + Math.random().toString(36).substr(2, 5),
            type,
            name,
            amount,
            day,
            category,
            paymentMethod,
            paymentDetail,
            memo,
            durationMonths,
            startYearMonth,
            isPaid: false
          });
          showToast('새 고정 항목이 등록되었습니다.');
        }

        saveExpenses();
        closeModal();
      } catch (err) {
        console.error('Save error:', err);
        alert('저장 중 오류가 발생했습니다: ' + err.message);
      }
    });

    // --- 6. 이벤트 핸들러 바인딩 ---
    // 납부 여부 체크박스 토글
    document.getElementById('expenseList').addEventListener('change', (e) => {
      if (e.target.classList.contains('toggle-paid')) {
        const id = e.target.dataset.id;
        const item = expenses.find(i => i.id === id);
        if (item) {
          item.isPaid = e.target.checked;
          saveExpenses();
          showToast(item.isPaid ? '완납 처리되었습니다.' : '미납 상태로 변경되었습니다.');
        }
      }
    });

    // 수정 및 삭제 클릭
    document.getElementById('expenseList').addEventListener('click', (e) => {
      const editBtn = e.target.closest('.edit-btn');
      const delBtn = e.target.closest('.delete-btn');

      if (delBtn) {
        const id = delBtn.dataset.id;
        const item = expenses.find(i => i.id === id);
        if (confirm(`'${item ? item.name : '항목'}'을(를) 삭제하시겠습니까?`)) {
          expenses = expenses.filter(i => i.id !== id);
          saveExpenses();
          showToast('항목이 삭제되었습니다.');
        }
      } else if (editBtn) {
        const id = editBtn.dataset.id;
        openModal(id);
      }
    });

    // 필터 탭 전환
    document.querySelectorAll('.filter-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.filter-tab').forEach(t => {
          t.classList.remove('bg-white', 'text-slate-900', 'shadow-sm');
          t.classList.add('text-slate-600');
        });
        tab.classList.add('bg-white', 'text-slate-900', 'shadow-sm');
        tab.classList.remove('text-slate-600');
        currentFilter = tab.dataset.filter;
        render();
      });
    });

    // 검색 및 정렬 감지
    document.getElementById('searchInput').addEventListener('input', render);
    document.getElementById('sortSelect').addEventListener('change', render);

    // 샘플 데이터 채우기
    document.getElementById('quickFillBtn').addEventListener('click', () => {
      if (confirm('실생활 샘플 데이터를 불러오시겠습니까? 기존 목록 뒤에 추가됩니다.')) {
        expenses = [...expenses, ...sampleData];
        saveExpenses();
        showToast('샘플 데이터가 등록되었습니다.');
      }
    });

    // 백업 (JSON 다운로드)
    document.getElementById('exportBtn').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(expenses, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `고정지출_백업_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('백업 파일이 다운로드되었습니다.');
    });

    // 복원 (JSON 업로드)
    document.getElementById('importFile').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const imported = JSON.parse(event.target.result);
          if (Array.isArray(imported)) {
            expenses = imported.map(item => ({
              ...item,
              durationMonths: item.durationMonths ? Number(item.durationMonths) : null
            }));
            saveExpenses();
            showToast('데이터 복원이 완료되었습니다.');
          }
        } catch (err) {
          alert('올바른 백업 파일(JSON)이 아닙니다.');
        }
      };
      reader.readAsText(file);
    });

    // 최초 렌더링
    render();
  </script>
</body>
</html>
